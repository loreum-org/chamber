# Aderyn project configuration (schema v1)
# https://aderyn.cyfrin.io/configuration/using-the-config-file
#
# Cyfrin/aderyn-ci has no baseline/diff mode. fail-on: high is absolute.
# Acknowledged High detectors from the initial scan are excluded below so
# CI only fails when a *new* High detector kind fires. Path exclude is not
# a severity baseline.

version = 1
root = "."

# Scope: production sources only (Foundry src/). Skip tests, scripts, deps.
exclude = ["test/", "script/", "lib/"]

# Triaged High detectors (tracked offline / in contracts/report.md notes):
#   contract-locks-ether — Chamber is ERC4626 vault; ETH handling intentional
#   incorrect-erc721-interface — membership ERC721 surface; review separately
#   reentrancy-state-change — known CEI findings; covered by review/tests
#   unsafe-casting — acknowledged casting sites; incremental cleanup
[detectors]
exclude = [
  "contract-locks-ether",
  "incorrect-erc721-interface",
  "reentrancy-state-change",
  "unsafe-casting",
]