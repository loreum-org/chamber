# Chamber state queries (Ponder 0.8: limit / items, not first / skip).
# Ids are lowercase hex. Every row is scoped by chainId (CREATE2 addresses
# repeat across chains). Select `_meta { status }` and read the network that
# matches the chain (baseSepolia, arbitrumSepolia, opSepolia, sepolia).

query ChamberState($chainId: Int!, $chamber: String!) {
  chamber(chainId: $chainId, id: $chamber) {
    address
    name
    symbol
    asset
    nft
    decimals
    seats
    quorum
    boardSize
    reachableDirectors
    transactionCount
    totalAssets
    totalSupply
    ethBalance
    paused
    implementation
    version
    updatedBlock
  }
  seatUpdate(chainId: $chainId, chamberId: $chamber) {
    proposedSeats
    timestamp
    requiredQuorum
    supporters
  }
  _meta {
    status
  }
}

# Ranked board. Top seats are rank < chamber.seats; directors are their owners.
query ChamberBoard($chainId: Int!, $chamber: String!) {
  boardSeats(where: { chainId: $chainId, chamberId: $chamber }, orderBy: "rank", orderDirection: "asc", limit: 1000) {
    items {
      tokenId
      rank
      amount
      owner
      seatedAt
    }
  }
  _meta {
    status
  }
}

query ChamberProposals($chainId: Int!, $chamber: String!) {
  proposals(where: { chainId: $chainId, chamberId: $chamber }, orderBy: "nonce", orderDirection: "asc", limit: 1000) {
    items {
      nonce
      proposerTokenId
      target
      value
      data
      dataHash
      metadataURI
      deadline
      requiredQuorum
      confirmations
      cancelConfirmations
      executed
      cancelled
      submittedAt
      submittedTx
      executedTx
    }
  }
  proposalVotes(where: { chainId: $chainId, chamberId: $chamber }, limit: 1000) {
    items {
      nonce
      tokenId
      confirmed
      cancelVoted
    }
  }
  _meta {
    status
  }
}

query HolderDelegations($chainId: Int!, $chamber: String!, $holder: String!) {
  delegations(where: { chainId: $chainId, chamberId: $chamber, holder: $holder, amount_gt: "0" }) {
    items {
      tokenId
      amount
    }
  }
  chamberHolder(chainId: $chainId, chamberId: $chamber, account: $holder) {
    shares
  }
}

query DirectorOperators($chainId: Int!, $chamber: String!) {
  directorOperators(where: { chainId: $chainId, chamberId: $chamber }) {
    items {
      tokenId
      owner
      operator
      expiry
      scope
      liveAt
    }
  }
}

query ChamberActivity($chainId: Int!, $chamber: String!, $limit: Int) {
  chamberEvents(where: { chainId: $chainId, chamberId: $chamber }, orderBy: "blockNumber", orderDirection: "desc", limit: $limit) {
    items {
      name
      args
      blockNumber
      timestamp
      txHash
    }
  }
}
