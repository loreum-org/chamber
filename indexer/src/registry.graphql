# Registry / Factory creation events

query GetRegistryChamberCreatedEvents($limit: Int) {
  registry_ChamberCreateds(limit: $limit, orderBy: "id", orderDirection: "desc") {
    items {
      id
      chamber
      seats
      name
      symbol
      erc20Token
      erc721Token
    }
  }
}

query GetFactoryChamberCreatedEvents($chainId: Int!, $limit: Int, $creator: String) {
  factory_ChamberCreateds(where: { chainId: $chainId, creator: $creator }, limit: $limit, orderBy: "id", orderDirection: "desc") {
    items {
      id
      chamber
      asset
      nft
      seats
      name
      symbol
      creator
    }
  }
}

query GetInitializedEvents($limit: Int) {
  registry_Initializeds(limit: $limit, orderBy: "id", orderDirection: "desc") {
    items {
      id
      version
    }
  }
}

query GetRoleAdminChangedEvents($chainId: Int!, $limit: Int, $role: String) {
  registry_RoleAdminChangeds(where: { chainId: $chainId, role: $role }, limit: $limit, orderBy: "id", orderDirection: "desc") {
    items {
      id
      role
      previousAdminRole
      newAdminRole
    }
  }
}

query GetRoleGrantedEvents($chainId: Int!, $limit: Int, $account: String) {
  registry_RoleGranteds(where: { chainId: $chainId, account: $account }, limit: $limit, orderBy: "id", orderDirection: "desc") {
    items {
      id
      role
      account
      sender
    }
  }
}

query GetRoleRevokedEvents($chainId: Int!, $limit: Int, $account: String) {
  registry_RoleRevokeds(where: { chainId: $chainId, account: $account }, limit: $limit, orderBy: "id", orderDirection: "desc") {
    items {
      id
      role
      account
      sender
    }
  }
}
